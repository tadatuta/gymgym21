services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "docker-start.mjs"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gym21}
      POSTGRES_USER: ${POSTGRES_USER:-gym21}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      APP_BASE_URL: ${APP_BASE_URL}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Nginx upstream uses this fixed container endpoint.
      PORT: "8788"
      HOST: "0.0.0.0"
      TRUST_PROXY: ${TRUST_PROXY:-1}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-60000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_USERNAME_CHECK_WINDOW_MS: ${RATE_LIMIT_AUTH_USERNAME_CHECK_WINDOW_MS:-60000}
      RATE_LIMIT_AUTH_USERNAME_CHECK_MAX: ${RATE_LIMIT_AUTH_USERNAME_CHECK_MAX:-30}
      RATE_LIMIT_SYNC_WINDOW_MS: ${RATE_LIMIT_SYNC_WINDOW_MS:-60000}
      RATE_LIMIT_SYNC_MAX: ${RATE_LIMIT_SYNC_MAX:-20}
      RATE_LIMIT_SYNC_MAX_CONCURRENT: ${RATE_LIMIT_SYNC_MAX_CONCURRENT:-1}
      RATE_LIMIT_AI_WINDOW_MS: ${RATE_LIMIT_AI_WINDOW_MS:-300000}
      RATE_LIMIT_AI_MAX: ${RATE_LIMIT_AI_MAX:-3}
      RATE_LIMIT_AI_MAX_CONCURRENT: ${RATE_LIMIT_AI_MAX_CONCURRENT:-1}
      AI_MODEL: ${AI_MODEL:-gemini-3-flash-preview}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-12000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-8000}
      AI_MAX_RECENT_LOGS: ${AI_MAX_RECENT_LOGS:-40}
      AI_MAX_EXERCISE_COUNT: ${AI_MAX_EXERCISE_COUNT:-50}
      AI_TEXT_FIELD_MAX_LENGTH: ${AI_TEXT_FIELD_MAX_LENGTH:-400}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a unique BETTER_AUTH_SECRET}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME}
      TELEGRAM_PLACEHOLDER_EMAIL_DOMAIN: ${TELEGRAM_PLACEHOLDER_EMAIL_DOMAIN:-telegram.local.invalid}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/var/secrets/google-application-credentials.json}
    volumes:
      - ./secrets:/var/secrets:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gym21}
      POSTGRES_USER: ${POSTGRES_USER:-gym21}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
